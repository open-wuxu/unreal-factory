<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>诛仙 · 青云山七峰</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b1119'/%3E%3Cpath d='M8 48 L24 22 L34 38 L42 28 L56 48 Z' fill='%23d8b06a'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <header class="hud hud--top">
      <div class="brand">
        <span class="brand__seal">诛仙</span>
        <div class="brand__text">
          <h1>青云山七峰</h1>
          <p>云海仙门 · 三维山水</p>
        </div>
      </div>

      <nav class="views" aria-label="山峰机位">
        <button type="button" data-view="overview" class="is-active">全景</button>
        <button type="button" data-view="tongtian">通天</button>
        <button type="button" data-view="longshou">龙首</button>
        <button type="button" data-view="luoxia">落霞</button>
        <button type="button" data-view="fenghui">风回</button>
        <button type="button" data-view="dazhu">大竹</button>
        <button type="button" data-view="xiaozhu">小竹</button>
        <button type="button" data-view="chaoyang">朝阳</button>
        <a class="watch" href="?film=1">观看影片</a>
      </nav>
    </header>

    <footer class="hud hud--bottom">
      <div class="transport">
        <button
          type="button"
          class="transport__play"
          data-action="play"
          aria-label="播放"
        >
          ▶
        </button>
        <button type="button" data-action="replay">重播</button>
        <input
          class="transport__timeline"
          type="range"
          data-time
          min="0"
          max="36"
          step="0.05"
          value="0"
          aria-label="时间轴"
        />
        <span class="transport__time" data-time-label>00:00 / 00:36</span>
      </div>

      <div class="toggles">
        <label><input type="checkbox" data-toggle="clouds" checked /><span>云海</span></label>
        <label><input type="checkbox" data-toggle="mist" checked /><span>雾</span></label>
        <label><input type="checkbox" data-toggle="subtitles" checked /><span>字幕</span></label>
        <label><input type="checkbox" data-toggle="sound" /><span>声音</span></label>
      </div>
    </footer>

    <section id="film" class="film" aria-hidden="true">
      <a class="film__back" href="./">返回</a>
      <div class="film__fade" data-film="fade"></div>
      <div class="film__wipe" data-film="wipe"></div>
      <div class="film__subtitle" data-film="subtitle"></div>
      <div class="film__title" data-film="title">
        <h2>青云七峰</h2>
        <p>云 海 仙 门</p>
      </div>
      <button id="film-sound" class="film__sound" type="button" aria-pressed="false">
        声音 · 关
      </button>
    </section>

    <div id="loading" class="loading">
      <div class="loading__seal">青云</div>
      <div class="loading__text">正在生成七峰云海…</div>
    </div>

    <div id="fallback" class="fallback" hidden>
      <h1>需要 WebGL 2</h1>
      <p>请使用支持 WebGL 2 的桌面浏览器打开本页。</p>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
